<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RYUMON</title>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script>
<style>
  html, body { margin: 0; height: 100%; background: #101014; color: #ddd; font: 13px/1.3 system-ui, sans-serif; overflow: hidden; }
  #wrap { position: absolute; inset: 0 0 64px 0; display: flex; align-items: center; justify-content: center; }
  #film { max-width: 100%; max-height: 100%; aspect-ratio: 1920 / 1040; background: #000; }
  body.headless #wrap { inset: 0; }
  body.headless #film { width: 1920px; height: 1040px; max-width: none; max-height: none; }
  #bar { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; padding: 6px 12px; box-sizing: border-box; background: #18181e; }
  #row { display: flex; gap: 10px; align-items: center; }
  #scrub { flex: 1; }
  #play { width: 64px; }
  #label { font-variant-numeric: tabular-nums; white-space: nowrap; min-width: 520px; }
  #timeline { position: relative; height: 18px; margin-top: 6px; }
  .seg { position: absolute; top: 0; height: 18px; box-sizing: border-box; border-right: 1px solid #101014; font-size: 10px; color: #fff; text-align: center; overflow: hidden; cursor: pointer; }
  .head { position: absolute; top: -2px; width: 2px; height: 22px; background: #fff; pointer-events: none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="film" width="1920" height="1040"></canvas></div>
<div id="bar" style="display:none">
  <div id="row"><button id="play">play</button><input id="scrub" type="range" min="0" max="2111" value="0"><span id="label">loading…</span></div>
  <div id="timeline"></div>
</div>
<script>if (new URLSearchParams(location.search).get('headless') === '1') document.body.classList.add('headless');</script>
<script type="module" src="./src/main.js"></script>
</body>
</html>
