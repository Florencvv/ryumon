<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RYŪMON · 竜門</title>
<meta name="description" content="RYŪMON (竜門): an 88-second anime short rendered entirely in code. The smallest koi in a temple pond swims upstream to a colossal waterfall in a storm, climbs it, and becomes a dragon.">
<meta name="theme-color" content="#0b0a12">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2314121e'/%3E%3Ccircle cx='16' cy='13' r='6' fill='%23ffd08a'/%3E%3Cpath d='M4 19h24' stroke='%23f6b8c8' stroke-width='1.6'/%3E%3Cellipse cx='16' cy='24' rx='5' ry='2.2' fill='%23ffd08a' opacity='.55'/%3E%3C/svg%3E">
<style>
:root{--bg:#0b0a12;--ink:#ece8f4;--dim:rgba(236,232,244,.62);--faint:rgba(236,232,244,.18);--gold:#ffd08a;--rose:#f6b8c8;
  --glass:rgba(16,14,26,.62);--sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(80% 60% at 50% 50%,#17142a 0%,var(--bg) 70%)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#frame{position:relative;width:min(100vw,calc(100vh * 1.84615));width:min(100dvw,calc(100dvh * 1.84615));aspect-ratio:1920/1040;background:#000;overflow:hidden;
  box-shadow:0 30px 90px -30px rgba(0,0,0,.9);user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame:fullscreen{width:100%;height:100%;aspect-ratio:auto;box-shadow:none}
#frame.hidecur{cursor:none}
video{position:absolute;inset:0;width:100%;height:100%;display:block;object-fit:contain;background:#000}
#grain{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;opacity:.07;mix-blend-mode:overlay;image-rendering:pixelated}
#load{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--dim);font-size:13px;letter-spacing:.12em}
#load .meter{width:180px;height:2px;background:var(--faint);border-radius:2px;overflow:hidden}
#load .meter i{display:block;height:100%;width:40%;background:linear-gradient(90deg,var(--rose),var(--gold));animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
#load[hidden]{display:none}
button{font:inherit;color:var(--ink);background:none;border:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus{outline:none}
button:focus-visible,#track:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(10px) saturate(1.2);-webkit-backdrop-filter:blur(10px) saturate(1.2);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08)}
#big{position:absolute;left:50%;top:50%;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .3s}
#big.on{opacity:1;pointer-events:auto}
#big svg{width:30px;height:30px;fill:var(--ink);margin-left:4px}
#unmute{position:absolute;right:16px;top:16px;padding:8px 14px;border-radius:999px;display:flex;align-items:center;gap:8px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .3s}
#unmute.on{opacity:1;pointer-events:auto}
#unmute svg{width:18px;height:18px;fill:currentColor}
#bar{position:absolute;left:12px;right:12px;bottom:12px;max-width:1100px;margin:0 auto;padding:2px 8px;border-radius:12px;display:flex;align-items:center;gap:4px;
  opacity:0;pointer-events:none;transition:opacity .4s}
#frame.show #bar{opacity:1;pointer-events:auto}
.ic{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:8px}
.ic:hover{background:rgba(255,255,255,.08)}
.ic svg{width:22px;height:22px;fill:var(--ink)}
.time{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim);flex:none;min-width:3.2em;text-align:center}
#track{position:relative;flex:1;height:32px;display:flex;align-items:center;cursor:pointer;touch-action:none;outline:none;margin:0 6px}
#rail{position:relative;width:100%;height:4px;background:var(--faint);border-radius:4px;transition:height .15s}
#track:hover #rail,#track.drag #rail{height:6px}
#buf{position:absolute;inset:0;border-radius:4px;background:rgba(236,232,244,.18);transform-origin:left;transform:scaleX(1)}
#fill{position:absolute;inset:0;border-radius:4px;background:linear-gradient(90deg,var(--rose),var(--gold));clip-path:inset(0 100% 0 0)}
#knob{position:absolute;top:50%;left:0;width:13px;height:13px;margin:-6.5px 0 0 -6.5px;border-radius:50%;background:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.6);transform:scale(0);transition:transform .15s}
#track:hover #knob,#track.drag #knob,#track:focus-visible #knob{transform:scale(1)}
#tip{position:absolute;bottom:28px;left:0;transform:translateX(-50%);padding:3px 8px;border-radius:6px;background:rgba(10,9,16,.9);font-size:12px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .15s;pointer-events:none;white-space:nowrap}
#track:hover #tip,#track.drag #tip{opacity:1}
@media (max-width:560px){.time.total{display:none}.ic{width:34px;height:34px}.ic svg{width:19px;height:19px}#bar{left:6px;right:6px;bottom:6px}}
@media (prefers-reduced-motion:reduce){#grain{display:none}#load .meter i{animation:none}}
</style>
</head>
<body>
<div id="stage">
  <div id="frame" class="show" role="region" aria-label="RYŪMON, animated short film">
    <video id="v" playsinline preload="auto"></video>
    <canvas id="grain" width="320" height="174" aria-hidden="true"></canvas>
    <div id="load"><div class="meter"><i></i></div><span>loading</span></div>
    <button id="big" class="glass" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z"/></svg></button>
    <button id="unmute" class="glass" aria-label="Turn sound on"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>sound on</button>
    <div id="bar" class="glass">
      <button id="pp" class="ic" aria-label="Play (K)"><svg viewBox="0 0 24 24"><path id="ppi" d="M7 4.5v15l12.5-7.5z"/></svg></button>
      <span id="cur" class="time">0:00</span>
      <div id="track" tabindex="0" role="slider" aria-label="Seek" aria-valuemin="0" aria-valuemax="88" aria-valuenow="0">
        <div id="rail"><div id="buf"></div><div id="fill"></div></div><div id="knob"></div><div id="tip">0:00</div>
      </div>
      <span id="dur" class="time total">0:00</span>
      <button id="mute" class="ic" aria-label="Mute (M)"><svg viewBox="0 0 24 24"><path id="mi" d=""/></svg></button>
      <button id="fs" class="ic" aria-label="Fullscreen (F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zm11-5h5v5h-2V6h-3zM6 15v3h3v2H4v-5zm12 0h2v5h-5v-2h3z"/></svg></button>
    </div>
  </div>
</div>
<script id="film" type="application/octet-stream">%%VIDEO_B64%%</script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const v = $('v'), frame = $('frame'), bar = $('bar'), track = $('track'), fill = $('fill'), knob = $('knob'), tip = $('tip');
  const PLAY = 'M7 4.5v15l12.5-7.5z', PAUSE = 'M6.5 4.5h4v15h-4zm7 0h4v15h-4z';
  const SND = 'M4 9v6h4l5 4V5L8 9zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z';
  const MUTED = 'M4 9v6h4l5 4V5L8 9zm11.6 3 2.7-2.7 1.4 1.4-2.7 2.7 2.7 2.7-1.4 1.4-2.7-2.7-2.7 2.7-1.4-1.4 2.7-2.7-2.7-2.7 1.4-1.4z';
  const fmt = (s) => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

  // the film: base64 MP4 in the page -> Blob -> object URL (works offline from file://)
  const decode = async () => {
    const b64 = $('film').textContent.replace(/\s+/g, ''), parts = [], CH = 4 << 20;   // 4 M chars per slice
    for (let i = 0; i < b64.length; i += CH) {
      const s = atob(b64.slice(i, i + CH)), u = new Uint8Array(s.length);
      for (let j = 0; j < s.length; j++) u[j] = s.charCodeAt(j);
      parts.push(u); await new Promise((r) => setTimeout(r));
    }
    $('film').textContent = '';
    return new Blob(parts, { type: 'video/mp4' });
  };
  decode().then((blob) => {
    v.src = URL.createObjectURL(blob);
    v.addEventListener('loadedmetadata', () => { $('load').hidden = true; $('dur').textContent = fmt(v.duration); track.setAttribute('aria-valuemax', Math.round(v.duration)); start(); }, { once: true });
  });

  // autoplay with sound; when the browser refuses, play muted and offer "sound on"
  function start() {
    v.muted = false;
    v.play().catch(() => { v.muted = true; v.play().then(() => $('unmute').classList.add('on')).catch(() => $('big').classList.add('on')); });
  }
  const toggle = () => { if (v.paused || v.ended) v.play().catch(() => {}); else v.pause(); };
  const mute = () => { v.muted = !v.muted; $('unmute').classList.remove('on'); };
  const seek = (t) => { v.currentTime = Math.min(Math.max(t, 0), (v.duration || 0) - 0.01); };
  const fs = () => { if (document.fullscreenElement) document.exitFullscreen(); else (frame.requestFullscreen || frame.webkitRequestFullscreen).call(frame); };

  $('pp').onclick = toggle; $('big').onclick = () => { $('big').classList.remove('on'); toggle(); };
  $('mute').onclick = mute; $('unmute').onclick = (e) => { e.stopPropagation(); v.muted = false; $('unmute').classList.remove('on'); };
  $('fs').onclick = fs;
  v.addEventListener('click', toggle); v.addEventListener('dblclick', fs);

  const sync = () => {
    $('ppi').setAttribute('d', v.paused ? PLAY : PAUSE); $('pp').setAttribute('aria-label', v.paused ? 'Play (K)' : 'Pause (K)');
    $('mi').setAttribute('d', v.muted ? MUTED : SND); $('mute').setAttribute('aria-label', v.muted ? 'Unmute (M)' : 'Mute (M)');
    if (v.paused) frame.classList.add('show');
  };
  ['play', 'pause', 'volumechange', 'ended'].forEach((e) => v.addEventListener(e, sync)); sync();
  v.addEventListener('play', () => $('big').classList.remove('on'));
  v.addEventListener('ended', () => $('big').classList.add('on'));

  const paint = () => {
    const k = v.duration ? v.currentTime / v.duration : 0;
    fill.style.clipPath = `inset(0 ${(1 - k) * 100}% 0 0)`; knob.style.left = k * 100 + '%';
    $('cur').textContent = fmt(v.currentTime); track.setAttribute('aria-valuenow', Math.round(v.currentTime));
    requestAnimationFrame(paint);
  };
  requestAnimationFrame(paint);

  // seek bar
  const at = (e) => { const r = track.getBoundingClientRect(); return Math.min(Math.max((e.clientX - r.left) / r.width, 0), 1); };
  track.addEventListener('pointerdown', (e) => { track.setPointerCapture(e.pointerId); track.classList.add('drag'); seek(at(e) * v.duration); });
  track.addEventListener('pointermove', (e) => {
    const k = at(e); tip.style.left = k * 100 + '%'; tip.textContent = fmt(k * (v.duration || 0));
    if (track.classList.contains('drag')) seek(k * v.duration);
  });
  const up = () => track.classList.remove('drag');
  track.addEventListener('pointerup', up); track.addEventListener('pointercancel', up);

  // keyboard: Space/K play-pause, arrows 5 s, M mute, F fullscreen
  addEventListener('keydown', (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === ' ' || k === 'k') { e.preventDefault(); toggle(); }
    else if (k === 'arrowleft') { e.preventDefault(); seek(v.currentTime - 5); }
    else if (k === 'arrowright') { e.preventDefault(); seek(v.currentTime + 5); }
    else if (k === 'm') mute();
    else if (k === 'f') fs();
    else return;
    poke();
  });

  // controls show on activity, hide after 2.4 s of playback
  let idle = 0;
  function poke() {
    frame.classList.add('show'); frame.classList.remove('hidecur'); clearTimeout(idle);
    idle = setTimeout(() => { if (!v.paused && !track.classList.contains('drag')) { frame.classList.remove('show'); frame.classList.add('hidecur'); } }, 2400);
  }
  ['pointermove', 'pointerdown', 'touchstart'].forEach((e) => frame.addEventListener(e, poke, { passive: true }));
  v.addEventListener('play', poke);

  // subtle film grain: a small noise canvas redrawn 12 times a second, stretched over the frame (overlay blend)
  const g = $('grain'), gx = g.getContext('2d'), img = gx.createImageData(g.width, g.height);
  let last = 0, seed = 1;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296);
  (function grain(t) {
    if (t - last > 83) {
      last = t; const d = img.data;
      for (let i = 0; i < d.length; i += 4) { const n = 96 + rnd() * 64 | 0; d[i] = d[i + 1] = d[i + 2] = n; d[i + 3] = 255; }
      gx.putImageData(img, 0, 0);
    }
    requestAnimationFrame(grain);
  })(0);
})();
</script>
</body>
</html>
